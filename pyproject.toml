[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pitch-type-probabilities"
version = "1.0.0"
description = "Reproducible pitch-type probability model for the supplied technical task dataset"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.3.5",
  "pandas==2.2.3",
  "scipy==1.17.0",
  "scikit-learn==1.8.0",
  "xgboost==3.1.3",
  "catboost==1.2.8",
  "lightgbm==4.6.0",
  "joblib==1.5.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "matplotlib==3.10.8",
]

[project.scripts]
pitch-train = "pitch_type_prediction.train:main"
pitch-predict = "pitch_type_prediction.predict:main"
pitch-research = "pitch_type_prediction.research:main"
pitch-report = "pitch_type_prediction.report:main"
pitch-audit = "pitch_type_prediction.audit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
